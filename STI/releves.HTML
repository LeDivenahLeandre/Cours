<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevés Météo</title>
</head>
<body>
    

    <h1>Station Météo</h1>    <!-- Abréviation : h1{Station Météo} -->


    <!-- Abréviation : table>(tr>th{Heure}+th{Température}+th{Humidité})+(tr*5>td{0$:00}+td*2) -->

    <table>
        <tr>
            <th>Heure</th>
            <th>Température</th>
            <th>Humidité</th>
        </tr>
        <tr>
            <td>01:00</td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td>02:00</td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td>03:00</td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td>04:00</td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td>05:00</td>
            <td></td>
            <td></td>
        </tr>
    </table>


    <ul class = "capteurs">    <!-- Ici, abréviations : ul.Capteurs>li.{Capteur $}*3 -->
        <li class="capteur">Capteur 1</li>
        <li class="capteur">Capteur 2</li>
        <li class="capteur">Capteur 3</li>
    </ul>

</body>
</html>
