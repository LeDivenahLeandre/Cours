<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InscriptionClubArduino</title>
</head>
<body>
    <h1>Inscription au club Arduino</h1>
    <h2>Veuillez remplir ce formulaire :</h2>

    <form method ="POST" action="#">
        
            <fieldset>
                <legend>Identité</legend>
                <label for="lastname">Nom</label>
                <input type="text" name="lastname" id="lastname" placeholder="Dupont" required>

                <label for="firstname">Prénom</label>
                <input type="text" name="firstname" id="firstname" placeholder="Jean" required>

                <label for="email">Adresse Email</label>
                <input type="email" name="email" id="email" placeholder="dupontjean@domain.fr" required>

                <label for="phone">Numéro de Téléphone</label>
                <input type="tel" name="phone" id="phone" pattern="[0-9]{10}" required>

                <label for="birthdate">Date de naissance</label>
                <input type="date" id="birthdate" name="birthdate" required>
            </fieldset>

            <fieldset>
                <legend>Préférences</legend>

                <label for="beginner">Débutant</label>
                <input type="radio" name="level" id="beginner" checked>

                <label for="medium">Intermédiaire</label>
                <input type="radio" name="level" id="medium">

                <label for="advanced">Avancé</label>
                <input type="radio" name="level" id="advanced">


                <label for="homeAutomation">Domotique</label>
                <input type="checkbox" name="interests" id="homeAutomation" value="homeAutomation">
                <label for="robotics">Robotique</label>
                <input type="checkbox" name="interests" id="robotics" value="robotics">
                <label for="sensors">Capteurs</label>
                <input type="checkbox" name="interests" id="sensors" value="sensors">
                <label for="network">Réseau</label>
                <input type="checkbox" name="interests" id="network" value="network">
                
                <label for="time">Créneaux :</label>
                <select name="time" id="time" required>
                    <option value="mardi soir">Mardi soir</option>
                    <option value="mercredi apres midi">Mercredi après-midi</option>
                    <option value="jeudi midi">Jeudi midi</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Votre projet</legend>
                <label for="description">Description</label>
                <textarea name="description" id="description" rows="6" cols="80" minlength="20"></textarea>

                <label for="imgsend">Envoi de votre photo de montage</label>
                <input type="file" name="imgsend" id="imgsend" accept="image/*">

                <input type="checkbox" name="reglement" value="reglement" required> J'accepte le règlement du club.
            </fieldset>
        <button type="submit">Envoyer</button>
    </form>


</body>
</html>
